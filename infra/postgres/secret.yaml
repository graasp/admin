# !! TEMPLATE — do NOT fill in real values here. !!
#
# Workflow:
#   cp infra/postgres/secret.yaml infra/postgres/secret.local.yaml
#   # edit secret.local.yaml — replace <CHANGE_ME> with a real password
#   kubectl apply -f infra/postgres/secret.local.yaml
#
# Files matching infra/**/*.local.yaml are gitignored and will never be committed.
# To generate a strong password: openssl rand -base64 32
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: graasp
type: Opaque
stringData:
  POSTGRES_USER: admin
  POSTGRES_PASSWORD: "<CHANGE_ME>"
  POSTGRES_DB: admin_prod
