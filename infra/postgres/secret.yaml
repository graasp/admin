# Template — replace all <CHANGE_ME> values before applying.
# To generate a strong password: openssl rand -base64 32
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: graasp
type: Opaque
stringData:
  POSTGRES_USER: admin
  POSTGRES_PASSWORD: "<CHANGE_ME>"
  POSTGRES_DB: admin_prod
