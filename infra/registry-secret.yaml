# imagePullSecret for Infomaniak Container Registry.
#
# Generate the base64-encoded auth string and apply with:
#
#   kubectl create secret docker-registry infomaniak-registry \
#     --namespace graasp \
#     --docker-server=registry.infomaniak.com \
#     --docker-username=<INFOMANIAK_USERNAME> \
#     --docker-password=<INFOMANIAK_PASSWORD>
#
# Or fill in the template below (base64-encode the JSON yourself):
#   echo -n '{"auths":{"registry.infomaniak.com":{"auth":"<base64(user:pass)>"}}}' | base64
apiVersion: v1
kind: Secret
metadata:
  name: infomaniak-registry
  namespace: graasp
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: "<BASE64_ENCODED_DOCKER_CONFIG>"
