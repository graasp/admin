# !! TEMPLATE — do NOT fill in real values here. !!
#
# Workflow:
#   cp infra/admin/secret.yaml infra/admin/secret.local.yaml
#   # edit secret.local.yaml with real values
#   kubectl apply -f infra/admin/secret.local.yaml
#
# Files matching infra/**/*.local.yaml are gitignored and will never be committed.
#
# DATABASE_URL format: ecto://USER:PASS@postgres.graasp.svc.cluster.local/DB
#   USER and PASS must match infra/postgres/secret.local.yaml
#
# SECRET_KEY_BASE: generate with `mix phx.gen.secret` (64-char hex string)
#
# AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY: Infomaniak Object Storage credentials
#   Create an access key in the Infomaniak manager under Public Cloud > Object Storage.
#
# Optional values can be left empty ("") to disable the feature.
apiVersion: v1
kind: Secret
metadata:
  name: admin-secret
  namespace: graasp
type: Opaque
stringData:
  DATABASE_URL: "ecto://admin:<CHANGE_ME>@postgres.graasp.svc.cluster.local/admin_prod"
  SECRET_KEY_BASE: "<CHANGE_ME>"

  AWS_ACCESS_KEY_ID: "<CHANGE_ME>"
  AWS_SECRET_ACCESS_KEY: "<CHANGE_ME>"

  MEILISEARCH_REBUILD_SECRET: "<CHANGE_ME>"

  UMAMI_USERNAME: "<CHANGE_ME>"
  UMAMI_PASSWORD: "<CHANGE_ME>"
  UMAMI_WEBSITE_ID: "<CHANGE_ME>"
