# Requires an Ingress controller (nginx is typical on Infomaniak managed k8s).
# TLS certificate is managed by cert-manager with a Let's Encrypt ClusterIssuer.
# Install cert-manager: https://cert-manager.io/docs/installation/kubectl/
# Create a ClusterIssuer named "letsencrypt-prod" pointing to the ACME server.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: admin
  namespace: graasp
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # Required for Phoenix LiveView WebSocket upgrades
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
spec:
  tls:
    - hosts:
        - admin.graasp.org   # update to match PHX_HOST in configmap
      secretName: admin-tls
  rules:
    - host: admin.graasp.org  # update to match PHX_HOST in configmap
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: admin
                port:
                  number: 4000
