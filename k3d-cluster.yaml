apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: demo
servers: 1
agents: 2

registries:
  create:
    name: local-registry
    host: "0.0.0.0"
    hostPort: "5000"
  config: |
    mirrors:
      "localhost:5000":
        endpoint:
          - "http://local-registry:5000"
    configs:
      "localhost:5000":
        tls:
          insecure_skip_verify: true
